# Única composição de DESENVOLVIMENTO. Produção usa artefato versionado e
# configuração externa; este arquivo nunca é promovido como deploy.
name: crm-pnp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crm
      # Papel administrativo, usado somente pelo Flyway.
      POSTGRES_USER: crm_migrator
      # TESTE — TROCAR ANTES DE PRODUÇÃO.
      # Em produção vem de variável de ambiente, nunca de arquivo versionado.
      POSTGRES_PASSWORD: crm_migrator_dev_local
    ports:
      # 127.0.0.1 é proposital: o Docker publica em 0.0.0.0 por padrão e
      # ignora o firewall do sistema. Sem isso, seu banco fica exposto na
      # rede em que você estiver.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-runtime-user.sql:/docker-entrypoint-initdb.d/10-runtime-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_migrator -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # A 6379 desta máquina já pode pertencer ao Memurai. O projeto usa 6380
      # no host e 6379 apenas dentro da rede do Compose.
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution-postgres:
    image: postgres:17-alpine
    profiles: ["evolution"]
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      # Credencial descartavel, acessivel apenas na rede local do Compose.
      POSTGRES_PASSWORD: evolution_db_dev_local
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 15

  evolution-redis:
    image: redis:7-alpine
    profiles: ["evolution"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  evolution-api:
    # Versao estavel fixada para o laboratorio local. A 2.4 ainda e RC e
    # introduz ativacao de licenca; nenhuma imagem latest entra aqui.
    image: evoapicloud/evolution-api:v2.3.7
    profiles: ["evolution"]
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    environment:
      SERVER_NAME: crm-pnp-evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8081
      TELEMETRY_ENABLED: "false"
      CORS_ORIGIN: http://localhost:5174,http://localhost:8081
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_COLOR: "false"
      LOG_BAILEYS: error
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution_db_dev_local@evolution-postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: crm_pnp_dev
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: crm-pnp-evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution_api_dev_local_change_me}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      CONFIG_SESSION_PHONE_CLIENT: CRM PNP
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 30
      LANGUAGE: pt-BR
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - evolution_instances:/evolution/instances
    restart: unless-stopped

  media-init:
    image: alpine:3.23
    # O volume nasce como root. Este init efemero entrega somente a pasta de
    # quarentena ao UID sem privilegio usado pela aplicacao.
    command: ["sh", "-c", "chown -R 10001:10001 /media && chmod 700 /media"]
    volumes:
      - telegram_media_quarantine:/media
    restart: "no"

  telegram-tunnel:
    # Quick Tunnel oficial, somente para desenvolvimento. A versao e fixa
    # porque "latest" mudaria o ambiente sem revisao.
    image: cloudflare/cloudflared:2026.7.3
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:8080"]
    depends_on:
      app:
        condition: service_healthy
    profiles: ["telegram"]
    restart: unless-stopped

  app:
    image: crm-pnp-backend:${APP_IMAGE_TAG:-0.0.1-dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.0.1-dev}
        VCS_REF: ${VCS_REF:-working-tree}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/crm
      DB_RUNTIME_USER: crm_runtime
      # TESTE — credencial descartável, exclusiva desta composição local.
      DB_RUNTIME_PASSWORD: crm_runtime_dev_local
      DB_MIGRATION_URL: jdbc:postgresql://postgres:5432/crm
      DB_MIGRATION_USER: crm_migrator
      # TESTE — credencial descartável, exclusiva desta composição local.
      DB_MIGRATION_PASSWORD: crm_migrator_dev_local
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: http://localhost:5174
      # Volume privado e gravavel; a imagem e o restante do filesystem seguem read-only.
      TELEGRAM_MEDIA_STORAGE_PATH: /var/lib/crm/media-quarantine
      TELEGRAM_RECONCILIATION_ENABLED: ${TELEGRAM_RECONCILIATION_ENABLED:-false}
      TELEGRAM_PUBLIC_BASE_URL: ${TELEGRAM_PUBLIC_BASE_URL:-}
      # Ponte experimental local; producao permanece na Cloud API oficial.
      EVOLUTION_ENABLED: ${EVOLUTION_ENABLED:-true}
      EVOLUTION_API_BASE_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-evolution_api_dev_local_change_me}
      EVOLUTION_API_ORIGIN: http://localhost:8081
      EVOLUTION_WEBHOOK_BASE_URL: http://app:8080/api/webhooks/evolution
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - telegram_media_quarantine:/var/lib/crm/media-quarantine
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 6

volumes:
  postgres_data:
  telegram_media_quarantine:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:
