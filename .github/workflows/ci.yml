name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contrato-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verificar backend e snapshot OpenAPI
        working-directory: backend
        run: ./mvnw test
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Reprovar contrato TypeScript desatualizado
        working-directory: frontend
        run: npm run api:check
      - name: Verificar frontend
        working-directory: frontend
        run: npm run lint && npm test && npm run build

  # Segurança de cadeia de suprimentos. Job separado de propósito: um achado
  # aqui precisa ser legível como "o que reprovou foi segurança", e não sumir
  # no meio do log de testes.
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks precisa do histórico: segredo removido no commit seguinte
          # continua no histórico e continua vazado.
          fetch-depth: 0

      - name: Procurar segredo versionado
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar frontend
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Verificar que a auditoria falha fechado
        run: node --test .github/security/verificar-dependencias.test.mjs

      # O verificador falha fechado se a auditoria vier incompleta. Qualquer
      # exceção precisa ser nomeada, ter responsável e prazo.
      - name: Auditar dependências do frontend
        working-directory: frontend
        run: npm audit --json | node ../.github/security/verificar-dependencias.mjs

      # Varre a imagem final, incluindo dependências Java transitivas e pacotes
      # do sistema. Funciona em repositório privado sem GitHub Advanced
      # Security nem chave externa. O SHA é imutável e corresponde ao v0.36.0.
      - name: Construir imagem do backend para auditoria
        run: docker build --tag crm-pnp-backend:security ./backend

      - name: Auditar dependências do backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crm-pnp-backend:security
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Compara a árvore de dependências contra a base do PR e reprova o que a
      # mudança introduz de novo.
      #
      # A condição de visibilidade não é otimização: em repositório PRIVADO
      # esta ação exige GitHub Advanced Security, que é pago. Sem a condição, o
      # passo falharia em toda execução — e um passo que sempre falha é
      # desligado por alguém em duas semanas, junto com o resto do job.
      #
      # A imagem completa já foi varrida acima; este passo adicional continua
      # útil em repositório público para mostrar exatamente o que o PR trouxe.
      - name: Revisar dependências introduzidas pelo PR
        if: github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
