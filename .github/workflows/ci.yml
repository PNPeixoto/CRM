name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contrato-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verificar backend e snapshot OpenAPI
        working-directory: backend
        run: ./mvnw test
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar frontend
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Reprovar contrato TypeScript desatualizado
        working-directory: frontend
        run: npm run api:check
      - name: Verificar frontend
        working-directory: frontend
        run: npm run lint && npm test && npm run build

  # Segurança de cadeia de suprimentos. Job separado de propósito: um achado
  # aqui precisa ser legível como "o que reprovou foi segurança", e não sumir
  # no meio do log de testes.
  seguranca:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks precisa do histórico: segredo removido no commit seguinte
          # continua no histórico e continua vazado.
          fetch-depth: 0

      - name: Procurar segredo versionado
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar frontend
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      # `npm audit` sozinho reprovaria por vulnerabilidade que não alcança esta
      # aplicação, e o hábito de contornar com `|| true` desliga o controle
      # inteiro. O verificador exige exceção nomeada, com responsável e prazo,
      # e reprova quando o prazo vence.
      - name: Auditar dependências do frontend
        working-directory: frontend
        run: npm audit --json | node ../.github/security/verificar-dependencias.mjs

      # Compara a árvore de dependências contra a base do PR e reprova o que a
      # mudança introduz de novo.
      #
      # A condição de visibilidade não é otimização: em repositório PRIVADO
      # esta ação exige GitHub Advanced Security, que é pago. Sem a condição, o
      # passo falharia em toda execução — e um passo que sempre falha é
      # desligado por alguém em duas semanas, junto com o resto do job.
      #
      # Enquanto o repositório for privado sem GHAS, a cobertura de dependência
      # do backend fica com o Dependabot (alertas de segurança, gratuitos em
      # repositório privado) — ver SEC-017.
      - name: Revisar dependências introduzidas pelo PR
        if: github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
