spring:
  application:
    name: crm

  jackson:
    # DTOs são listas brancas. Campo desconhecido — inclusive tenantId — é
    # rejeitado em vez de ignorado silenciosamente.
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    hibernate:
      # validate: o Hibernate confere se o banco bate com as entidades e
      # falha se não bater. Nunca 'update' — ele altera o schema sozinho,
      # sem histórico, e o que roda em produção deixa de ser reproduzível.
      ddl-auto: validate
    # Fecha a sessão ao sair da camada de serviço. Evita consulta preguiçosa
    # disparada na serialização da resposta, que é onde nascem os erros de
    # lazy initialization e boa parte dos N+1.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Só estrutura. O seed de desenvolvimento vive em db/dev e é acrescentado
    # exclusivamente pelo profile dev — ver application-dev.yml. Produção não
    # tem como carregá-lo por esquecimento, porque o caminho não está aqui.
    locations: classpath:db/migration
    # Identificador confiável fornecido pelo deploy. É usado somente em
    # migrations de GRANT/REVOKE; a aplicação continua conectando pelo
    # datasource restrito, nunca pelo migrador.
    placeholders:
      runtime_role: ${DB_RUNTIME_USER:crm_runtime}

  data:
    redis:
      # Readiness precisa falhar rápido quando o cache fica indisponível; sem
      # limites explícitos, o probe pode expirar no proxy antes de responder.
      connect-timeout: 2s
      timeout: 2s

  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  security:
    # Sem valor padrão, de propósito: a aplicação não sobe sem estes segredos.
    # Um default aqui seria herdado silenciosamente em produção, e um pepper
    # público não é pepper.
    pepper: ${APP_PEPPER}
    jwt-signing-key: ${JWT_SIGNING_KEY}
    # Chave AES-256 (32 bytes em base64) para cifrar credenciais de canal em
    # repouso. Separada de propósito das duas acima: reaproveitar uma delas
    # faria um único vazamento comprometer senhas, sessões e credenciais de
    # integração de uma vez.
    channel-secret-key: ${CHANNEL_SECRET_KEY}
    # Chave distinta para segredos TOTP. Assim, a rotação de uma credencial de
    # integração não invalida MFA e um vazamento não cruza domínios.
    mfa-secret-key: ${MFA_SECRET_KEY}
    # HTTPS obrigatório fora de desenvolvimento: o cookie de refresh não pode
    # trafegar em texto puro, e o CSP não deve aceitar WebSocket sem TLS.
    cookie-secure: true
    websocket-exige-tls: true
    password-reset-delivery-enabled: ${PASSWORD_RESET_DELIVERY_ENABLED:true}
    password-reset-delivery-url: ${PASSWORD_RESET_DELIVERY_URL:}
  cors:
    # Vazio significa nenhuma origem permitida. Ausência de configuração
    # falha fechada.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  fila-de-saida:
    habilitada: true
    intervalo-ms: 2000
    tamanho-do-lote: 50
    # Teto de tentativas. É a fronteira entre "vai tentar de novo" e "não vai
    # mais" — aumentar em produção reabre mensagens que já estavam encerradas.
    max-tentativas: 5
    # Base do backoff exponencial: 30s, 60s, 120s, 240s, 480s.
    espera-base-segundos: 30

  entrada-de-webhook:
    habilitada: true
    # Mais curto que a fila de saída: mensagem recebida precisa aparecer na
    # tela do atendente rápido, e o processamento é local, sem rede.
    intervalo-ms: 1000
    tamanho-do-lote: 50
    max-tentativas: 5
    espera-base-segundos: 15

server:
  port: 8080
  shutdown: graceful
  # Falha segura: sem o profile prod, cabeçalhos de proxy são ignorados. O
  # profile de produção habilita a estratégia nativa com allowlist de proxy.
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # O CRM não atende corretamente sem a fonte da verdade nem sem o
        # componente usado por bloqueio/rate limit. Liveness continua local
        # para não reiniciar todas as instâncias por falha de dependência.
        readiness:
          include: readinessState,db,redis

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  level:
    br.com.pnp.crm: INFO
