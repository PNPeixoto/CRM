spring:
  application:
    name: crm

  jackson:
    # DTOs são listas brancas. Campo desconhecido — inclusive tenantId — é
    # rejeitado em vez de ignorado silenciosamente.
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    hibernate:
      # validate: o Hibernate confere se o banco bate com as entidades e
      # falha se não bater. Nunca 'update' — ele altera o schema sozinho,
      # sem histórico, e o que roda em produção deixa de ser reproduzível.
      ddl-auto: validate
    # Fecha a sessão ao sair da camada de serviço. Evita consulta preguiçosa
    # disparada na serialização da resposta, que é onde nascem os erros de
    # lazy initialization e boa parte dos N+1.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Só estrutura. O seed de desenvolvimento vive em db/dev e é acrescentado
    # exclusivamente pelo profile dev — ver application-dev.yml. Produção não
    # tem como carregá-lo por esquecimento, porque o caminho não está aqui.
    locations: classpath:db/migration
    # Identificador confiável fornecido pelo deploy. É usado somente em
    # migrations de GRANT/REVOKE; a aplicação continua conectando pelo
    # datasource restrito, nunca pelo migrador.
    placeholders:
      runtime_role: ${DB_RUNTIME_USER:crm_runtime}

  data:
    redis:
      # Readiness precisa falhar rápido quando o cache fica indisponível; sem
      # limites explícitos, o probe pode expirar no proxy antes de responder.
      connect-timeout: 2s
      timeout: 2s

  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  http:
    # Vale também para JSON chunked: o filtro conta os bytes lidos e não
    # confia apenas em Content-Length.
    max-request-bytes: 1048576
    public-requests-per-minute: 120
    webhook-requests-per-minute: 60
  schema:
    # Atualizado junto com toda migration estrutural. Readiness compara este
    # valor ao histórico realmente aplicado e detecta inclusive imagem antiga.
    expected-version: "22"
  security:
    # Sem valor padrão, de propósito: a aplicação não sobe sem estes segredos.
    # Um default aqui seria herdado silenciosamente em produção, e um pepper
    # público não é pepper.
    pepper: ${APP_PEPPER}
    jwt-signing-key: ${JWT_SIGNING_KEY}
    # Chave AES-256 (32 bytes em base64) para cifrar credenciais de canal em
    # repouso. Separada de propósito das duas acima: reaproveitar uma delas
    # faria um único vazamento comprometer senhas, sessões e credenciais de
    # integração de uma vez.
    channel-secret-key: ${CHANNEL_SECRET_KEY}
    # Chave distinta para segredos TOTP. Assim, a rotação de uma credencial de
    # integração não invalida MFA e um vazamento não cruza domínios.
    mfa-secret-key: ${MFA_SECRET_KEY}
    # HMAC independente para URLs curtas de midia ja liberada pelo scanner.
    media-signing-key: ${MEDIA_SIGNING_KEY}
    # Chave exclusiva do cofre do conector HTTP. Segredos de integrações não
    # compartilham domínio criptográfico com canais, MFA ou URLs de mídia.
    http-connector-secret-key: ${HTTP_CONNECTOR_SECRET_KEY}
    # HTTPS obrigatório fora de desenvolvimento: o cookie de refresh não pode
    # trafegar em texto puro, e o CSP não deve aceitar WebSocket sem TLS.
    cookie-secure: true
    websocket-exige-tls: true
    password-reset-delivery-enabled: ${PASSWORD_RESET_DELIVERY_ENABLED:true}
    password-reset-delivery-url: ${PASSWORD_RESET_DELIVERY_URL:}
  cors:
    # Vazio significa nenhuma origem permitida. Ausência de configuração
    # falha fechada.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  fila-de-saida:
    habilitada: true
    intervalo-ms: 2000
    tamanho-do-lote: 50
    # Teto de tentativas. É a fronteira entre "vai tentar de novo" e "não vai
    # mais" — aumentar em produção reabre mensagens que já estavam encerradas.
    max-tentativas: 5
    # Base do backoff exponencial: 30s, 60s, 120s, 240s, 480s.
    espera-base-segundos: 30

  entrada-de-webhook:
    habilitada: true
    # Mais curto que a fila de saída: mensagem recebida precisa aparecer na
    # tela do atendente rápido, e o processamento é local, sem rede.
    intervalo-ms: 1000
    tamanho-do-lote: 50
    max-tentativas: 5
    espera-base-segundos: 15

  retencao-de-webhook:
    habilitada: true
    intervalo-ms: 3600000

  websocket:
    max-connections-per-user: 3
    max-connections-per-tenant: 100
    max-frames-per-second: 20
    session-expiration-check-ms: 5000

  conversation:
    sla:
      first-response-minutes: 15
      check-interval-ms: 30000
      check-batch-size: 100

  automation:
    worker-enabled: true
    worker-interval-ms: 1000
    batch-size: 25
    lease-seconds: 30
    max-duration-seconds: 300
    max-steps: 50
    max-branches: 20
    max-concurrent-per-tenant: 10
    max-executions-per-minute: 100
    max-pending-per-tenant: 1000

  http-connector:
    # Redirects permanecem desativados. Produção exige um proxy/política de
    # egress independente; desenvolvimento conecta diretamente ao IP A/AAAA
    # previamente validado e fixado.
    require-egress-proxy: false
    egress-proxy-url: ${HTTP_CONNECTOR_EGRESS_PROXY_URL:}
    max-concurrent-per-tenant: 4
    max-requests-per-minute: 120
    max-timeout-ms: 30000
    max-response-bytes: 1048576

  providers:
    evolution:
      enabled: ${EVOLUTION_ENABLED:false}
      base-url: ${EVOLUTION_API_BASE_URL:http://evolution-api:8080}
      api-key: ${EVOLUTION_API_KEY:}
      origin: ${EVOLUTION_API_ORIGIN:http://localhost:8081}
      webhook-base-url: ${EVOLUTION_WEBHOOK_BASE_URL:http://app:8080/api/webhooks/evolution}
      reconciliation-schedule-ms: ${EVOLUTION_RECONCILIATION_SCHEDULE_MS:10000}
      reconciliation-interval-seconds: ${EVOLUTION_RECONCILIATION_INTERVAL_SECONDS:30}
      reconciliation-batch-size: ${EVOLUTION_RECONCILIATION_BATCH_SIZE:10}
    telegram:
      # Contrato consultado na documentacao oficial em 2026-08-08.
      bot-api-version: "10.2"
      rate-limit-tenant-per-second: 30
      rate-limit-connection-per-second: 30
      reconciliation-enabled: ${TELEGRAM_RECONCILIATION_ENABLED:false}
      public-base-url: ${TELEGRAM_PUBLIC_BASE_URL:}
      reconciliation-schedule-ms: 60000
      reconciliation-interval-seconds: 300
      reconciliation-batch-size: 25
      media-storage-path: ${TELEGRAM_MEDIA_STORAGE_PATH:./var/media-quarantine}
      media-retention-enabled: true
      media-retention-schedule-ms: 3600000

server:
  port: 8080
  shutdown: graceful
  # Falha segura: sem o profile prod, cabeçalhos de proxy são ignorados. O
  # profile de produção habilita a estratégia nativa com allowlist de proxy.
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # O CRM não atende corretamente sem a fonte da verdade nem sem o
        # componente usado por bloqueio/rate limit. Liveness continua local
        # para não reiniciar todas as instâncias por falha de dependência.
        readiness:
          include: readinessState,db,redis,schemaVersion

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

logging:
  level:
    br.com.pnp.crm: INFO
